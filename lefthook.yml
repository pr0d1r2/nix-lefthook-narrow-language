---
output:
  - failure

remotes:
  - git_url: https://github.com/pr0d1r2/nix-lefthook-nixfmt
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-shellcheck
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-shfmt
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-deadnix
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-bats-parse
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-bats-unit
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-yamllint
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-nix-flake-check
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-typos
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-trailing-whitespace
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-missing-final-newline
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-git-conflict-markers
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-editorconfig-checker
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-git-no-local-paths
    ref: main
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/pr0d1r2/nix-lefthook-file-size-check
    ref: main
    configs:
      - lefthook-remote.yml

pre-commit:
  parallel: true
  commands:
    narrow-language-shell-compact:
      priority: 1
      timeout: 30s
      glob: "*.{sh,bats}"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-shell.dic
        NARROW_LANGUAGE_GLOB_INCLUDE: '\.(sh|bats)$'
      run: lefthook-narrow-language-compact
    narrow-language-shell-add:
      priority: 1
      timeout: 30s
      glob: "*.{sh,bats}"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-shell.dic
        NARROW_LANGUAGE_GLOB_INCLUDE: '\.(sh|bats)$'
      run: lefthook-narrow-language-add
    narrow-language-shell:
      priority: 2
      timeout: 30s
      glob: "*.{sh,bats}"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-shell.dic
      run: lefthook-narrow-language {staged_files}

pre-push:
  parallel: true
  commands:
    narrow-language-shell:
      timeout: 30s
      glob: "*.{sh,bats}"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-shell.dic
      run: lefthook-narrow-language {push_files}
