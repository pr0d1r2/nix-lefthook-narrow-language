      glob: "*.{js,jsx}"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-javascript.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-typescript:
      priority: 2
      timeout: 30s
      glob: "*.{ts,tsx}"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-typescript.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-erb:
      priority: 2
      timeout: 30s
      glob: "*.erb"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-erb.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-hcl:
      priority: 2
      timeout: 30s
      glob: "*.hcl"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-hcl.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-terraform:
      priority: 2
      timeout: 30s
      glob: "*.tf"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-terraform.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-css:
      priority: 2
      timeout: 30s
      glob: "*.css"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-css.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-scss:
      priority: 2
      timeout: 30s
      glob: "*.scss"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-scss.dic
      run: lefthook-narrow-language {staged_files}
    narrow-language-other:
      priority: 2
      timeout: 30s
      exclude:
        - "*.nix"
        - "*.sh"
        - "*.bats"
        - "*.py"
        - "*.rb"
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.erb"
        - "*.hcl"
        - "*.tf"
        - "*.css"
        - "*.scss"
        - "*.md"
        - "*.dic"
        - "flake.lock"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-other.dic
      run: lefthook-narrow-language {staged_files}

